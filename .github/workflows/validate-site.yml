name: Validate site invariants

# Site-wide drift gate: placeholders, retired canon tokens, broken/trailing-slash
# internal links, consent gating, canonical correctness, and JSON-LD completeness.
# Runs the full site on every PR that touches HTML or the validator — the check is
# cheap and the whole point is catching drift anywhere, not just in changed files.

on:
  # Runnable on demand as well as on PRs. Added 2026-08-27 after a batch was
  # pushed while no PR was open: no `pull_request` event ever fired for those
  # commits, so the claims gate had no run on that head and there was no
  # honest way to force one -- an empty commit or a close/reopen to kick CI is
  # not acceptable. This makes the gate available for any ref, any time, which
  # is what a gate guarding published claims should be.
  workflow_dispatch: {}

  # PUSH TO MAIN, added 2026-09-14 (CTO ruling, registry v3.59).
  #
  # Until today this workflow fired on `pull_request` ONLY, so any direct push to
  # main skipped the gate entirely -- and NOBODY WOULD HAVE KNOWN, because a gate
  # that never ran leaves no red check, only an absence. It was found because a
  # registry-only commit was fast-forwarded onto main and someone asked whether
  # the gate had run. It had not. Nor had it on any earlier direct push.
  #
  # That is the same shape as check-skill-sync.py reading one installed copy: a
  # control whose SCOPE is narrower than how its RESULT reads. The ruling that
  # changes go via PR fixes the instance; this trigger fixes the mechanism, and
  # only the mechanism survives someone being in a hurry.
  #
  # DELIBERATELY NO `paths:` FILTER HERE, unlike the pull_request trigger below.
  # A paths filter is precisely how something slips through -- it re-creates the
  # hole one file type at a time. The whole run is ~7 seconds; completeness is
  # worth more than the seconds.
  push:
    branches: [main, claude/gate-scope-control]

  pull_request:
    paths:
      - '**/*.html'
      - '_redirects'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'scripts/validate-site.py'
      - 'CANON-REGISTRY.md'
      - 'scripts/check-skill-sync.py'
      - 'scripts/gen-llms.py'
      - 'scripts/llms-config.json'
      - '.github/workflows/validate-site.yml'

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site invariant gate
        run: python3 scripts/validate-site.py
      # llms.txt coverage is gated against sitemap.xml rather than generated at
      # build time -- there is no build step here, and sitemap.xml is itself
      # hand-maintained. This is what makes coverage unable to drift: a page in
      # one and not the other fails the PR. Excluding a URL is a deliberate,
      # reviewable edit to scripts/llms-config.json, not an omission.
      - name: llms.txt covers the sitemap
        run: python3 scripts/gen-llms.py
      # lastmod overclaim gate. Deliberately NOT an equality check: a squash merge
      # re-dates the commit, so equality would turn main red for reasons unrelated
      # to content, and a check that flaps gets ignored. This fails only when a
      # lastmod claims a date NEWER than the file's real git date -- the case that
      # actually misleads a crawler. Values are set by evidence, by hand.
      - name: no sitemap lastmod overclaims its file
        run: python3 scripts/gen-lastmod.py
      # Registry/skill sync (v3.47). In CI only CHECK A binds -- every registry
      # entry from v3.47 declares whether it requires a skill edit -- because the
      # marketics-canon skill lives outside this repo and is not on the runner.
      # Check B (is the skill actually written back?) reports itself as NOT RUN
      # rather than passing silently; a silent skip would make this checker a
      # member of the family it exists to police. Run it WITH --require-skill in a
      # session or anywhere the skill is present, which is where B can bind.
      - name: registry declares skill impact
        run: python3 scripts/check-skill-sync.py
