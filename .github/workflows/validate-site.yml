name: Validate site invariants

# Site-wide drift gate: placeholders, retired canon tokens, broken/trailing-slash
# internal links, consent gating, canonical correctness, and JSON-LD completeness.
# Runs the full site on every PR that touches HTML or the validator — the check is
# cheap and the whole point is catching drift anywhere, not just in changed files.

on:
  # Runnable on demand as well as on PRs. Added 2026-08-27 after a batch was
  # pushed while no PR was open: no `pull_request` event ever fired for those
  # commits, so the claims gate had no run on that head and there was no
  # honest way to force one -- an empty commit or a close/reopen to kick CI is
  # not acceptable. This makes the gate available for any ref, any time, which
  # is what a gate guarding published claims should be.
  workflow_dispatch: {}
  pull_request:
    paths:
      - '**/*.html'
      - '_redirects'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'scripts/validate-site.py'
      - 'scripts/gen-llms.py'
      - 'scripts/llms-config.json'
      - '.github/workflows/validate-site.yml'

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site invariant gate
        run: python3 scripts/validate-site.py
      # llms.txt coverage is gated against sitemap.xml rather than generated at
      # build time -- there is no build step here, and sitemap.xml is itself
      # hand-maintained. This is what makes coverage unable to drift: a page in
      # one and not the other fails the PR. Excluding a URL is a deliberate,
      # reviewable edit to scripts/llms-config.json, not an omission.
      - name: llms.txt covers the sitemap
        run: python3 scripts/gen-llms.py
      # lastmod overclaim gate. Deliberately NOT an equality check: a squash merge
      # re-dates the commit, so equality would turn main red for reasons unrelated
      # to content, and a check that flaps gets ignored. This fails only when a
      # lastmod claims a date NEWER than the file's real git date -- the case that
      # actually misleads a crawler. Values are set by evidence, by hand.
      - name: no sitemap lastmod overclaims its file
        run: python3 scripts/gen-lastmod.py
