name: Post-deploy smoke test

# Verifies live response headers, redirect behavior, and shipped canon against a
# real deployment — the blind spot Lighthouse-on-a-local-server can't cover.
#
# Manual: Actions tab -> "Post-deploy smoke test" -> Run workflow -> paste a
# Netlify deploy-preview URL (they don't bot-block; production may 403 curl).
# Scheduled: a daily run against production as a live-regression tripwire.
#
# ── The unblocked-runner pattern (precedent set 2026-08-25, canon sweep) ──
# An agent session whose egress policy denies marketics.io can still verify
# live production by dispatching THIS workflow and reading the run log: the
# runner is not behind that policy. That is the sanctioned path — a policy
# denial gets reported and routed through here, never worked around by
# disabling TLS verification, unsetting a proxy, or finding another exit.
#
# CONSTRAINT, and it is not negotiable: this runner path carries READ-ONLY
# VERIFICATION AGAINST PRODUCTION AND NOTHING ELSE. It must never be extended
# to anything that writes, deploys, mutates remote state, or authenticates to
# a third party — no secrets, no credentialed calls, no POST/PUT/DELETE. The
# whole reason it is safe to reach for when normal egress is denied is that
# the worst case is a wasted GET. Widening it would turn a verification lane
# into an ambient egress bypass, which is exactly what the denial exists to
# prevent. Need something that writes? It does not belong in this workflow.
#
# Enforced below, not just asked for: the job token is read-only (`permissions:
# contents: read`) and no secrets are referenced, so a step that tried to write
# would fail rather than silently succeed.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to smoke-test (e.g. a deploy-preview URL)'
        required: true
        default: 'https://marketics.io'
  schedule:
    - cron: '17 13 * * *'   # 13:17 UTC daily — off the :00 mark

# Read-only by construction — see the constraint above. smoke.sh only ever
# issues GETs against a public URL, so the job needs nothing beyond checkout.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test
        run: |
          base="${{ github.event.inputs.base_url || 'https://marketics.io' }}"
          bash scripts/smoke.sh "$base"
