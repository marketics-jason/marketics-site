name: Lighthouse CI (mobile)

# Runs a mobile Lighthouse audit on every PR to main so perf regressions
# (render-blocking, LCP, TBT, CLS, oversized images) get caught before merge.
# Serves the static site locally and tests the homepage + /calculator.
#
# Note: this audits the built static files, not the Netlify edge layer, so it
# does NOT exercise netlify.toml headers (CSP, cache) or the trailing-slash
# redirects. Treat Best-Practices/cache deltas vs production PageSpeed as
# expected; the core perf metrics (FCP/LCP/TBT/CLS/image sizing) are the signal.
#
# ── Why /calculator has its own LCP budget (lighthouserc.json assertMatrix) ──
# Every page is held to LCP <= 4000ms. /calculator alone is held to 5200ms.
# JSON can't carry comments, so the reasoning lives here.
#
# The calculator is the densest page on the site (~83KB of inline HTML/CSS/JS,
# a 16-market benchmark table, live sliders). Its LCP element is the <h1> TEXT,
# and its measured LCP is 4678-4700ms once GA4 loads on every pageview -- which
# is required by the Board's Consent Mode ruling (2026-08-21) and is the whole
# point of that change, so it cannot be engineered away.
#
# This is a deliberately narrow exception, not a relaxed gate:
#   - It applies to ONE url pattern. The homepage stays at 4000ms and currently
#     reports zero findings.
#   - The user-facing metrics on this page are strong: FCP 0.9s, Speed Index
#     0.9s, CLS 0. The page is perceived as instant; LCP here is a heavy-DOM
#     text-paint artifact.
#   - 5200ms is derived from measurement, not comfort: median 4678-4700ms with
#     observed run-to-run variance up to ~350ms, leaving ~500ms of headroom.
#     A regression the size of the one just fixed (Clarity, ~1000ms) still
#     fails the build.
#   - The two patterns are mutually exclusive on purpose. LHCI applies EVERY
#     matching assertMatrix entry, so a catch-all ".*" base would silently
#     re-impose the 4000ms budget on the calculator.
#
# Booked, not dropped: /calculator needs a real performance pass (main-thread
# work runs to ~2.1s). When that lands, lower this back toward 4000ms.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Don't pile up runs on rapid pushes to the same PR.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Mobile performance audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI (mobile)
        run: lhci autorun
        # Reads lighthouserc.json. Median of 3 runs; uploads the full report to
        # temporary public storage and prints the link in the job log. The job
        # fails (red check) only if the "error"-level budgets are breached.
