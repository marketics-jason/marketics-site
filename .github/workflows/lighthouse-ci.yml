name: Lighthouse CI (mobile)

# Runs a mobile Lighthouse audit on every PR to main so perf regressions
# (render-blocking, LCP, TBT, CLS, oversized images) get caught before merge.
# Serves the static site locally and tests the homepage + /calculator.
#
# Note: this audits the built static files, not the Netlify edge layer, so it
# does NOT exercise netlify.toml headers (CSP, cache) or the trailing-slash
# redirects. Treat Best-Practices/cache deltas vs production PageSpeed as
# expected; the core perf metrics (FCP/LCP/TBT/CLS/image sizing) are the signal.
#
# ── /calculator's LCP exception, and why it is gone (2026-09-10) ──────────────
# Every page is held to LCP <= 4000ms. /calculator was held to 5200ms from
# 2026-08-31 until 2026-09-10. It is now back on the standard budget, and the
# reason the exception existed turned out to be a defect rather than a property
# of the page.
#
# What the exception was for: the page's measured LCP was 4678-4700ms, its LCP
# element was hero text, and the note here said that could not be engineered away
# because GA4 loads on every pageview under the Board's Consent Mode ruling.
#
# That diagnosis was wrong. The hero block and the calculator panel both carried
# .fi, which is opacity:0 until script adds .vis on IntersectionObserver, and
# Chrome does not treat an opacity:0 element as an LCP candidate. LCP was not
# waiting on the tag; it was waiting on the 17.7KB inline script parsing,
# executing, registering the observer and the observer firing. Moving those two
# above-the-fold blocks to a CSS animation that starts at first paint (.fi-atf,
# same fadeUp keyframes, identical visual) took the runner's median LCP from
# 4.7s to 2.0s and the performance score from 0.82 to 0.98.
#
# So the budget is 4000ms again, with ~2x headroom on the measured 2.0s. Keep the
# separate assertMatrix entry: LHCI applies EVERY matching entry, so the base
# pattern deliberately excludes this URL, and a catch-all ".*" would double up.
#
# The lesson worth keeping: a budget raised to accommodate a number nobody had
# root-caused is slack, and slack is where the next regression hides. Registry
# v3.46.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Don't pile up runs on rapid pushes to the same PR.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Mobile performance audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI (mobile)
        run: lhci autorun
        # Reads lighthouserc.json. Median of 3 runs; uploads the full report to
        # temporary public storage and prints the link in the job log. The job
        # fails (red check) only if the "error"-level budgets are breached.
