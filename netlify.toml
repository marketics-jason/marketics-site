# ══════════════════════════════════════════════════════
#  Marketics — Netlify Configuration
# ══════════════════════════════════════════════════════

# Trailing-slash canonicalisation
# Every page's <link rel="canonical"> uses the NO-SLASH form (/method).
#
# Aug 21 2026 — the slash/no-slash split is NOT cosmetic, but it is also not
# fixable with redirect rules on this platform. Recording both halves so this
# doesn't get re-attempted a fourth time.
#
# The problem is real: GSC shows Google indexing BOTH /page and /page/
# independently and splitting clicks/impressions/position between them
# (/intel/montreal/ holds the better average position, 6.49, and gets zero
# clicks; /intel/montreal at 7.08 gets all three). A canonical tag only hints
# a preference — it does not stop Google indexing a URL that returns 200.
#
# Two fixes were tried against deploy preview 115 and BOTH failed:
#   1. `force = true` 301s here, ordered before the 200 rewrites below.
#      Netlify's built-in directory-index resolution still won: /method/,
#      /intel/miami/ and /intel/miami/report/ all still returned 200.
#   2. The same rules in `_redirects` (which IS evaluated before this file —
#      see the costseg block there). Netlify normalises the trailing slash
#      off a `from` pattern, so `/:seg/` is treated as `/:seg` and matched the
#      NO-slash form too — self-redirecting the site and breaking the audit
#      404 guard, /join/confirmation's security headers, and the Index page.
#      13 smoke failures. Reverted.
#
# The remaining option is structural: flatten every foo/index.html to foo.html
# so there is no directory for Netlify to serve an index from, at which point
# the slash form 404s or redirects naturally. That touches all 51 pages and
# every internal link, so it is a scoped decision, not a config tweak — routed
# to the Boardroom rather than improvised here.
#
# No-slash form: served as a 200 rewrite (not a redirect) so /method,
# /intel/miami, and /intel/miami/report resolve directly, matching the
# canonical tags with no hop. Non-force, so real files (/assets/*,
# /robots.txt, /*.svg, …) keep static-file precedence over these.
[[redirects]]
  from = "/:seg"
  to = "/:seg/index.html"
  status = 200
[[redirects]]
  from = "/:a/:b"
  to = "/:a/:b/index.html"
  status = 200
[[redirects]]
  from = "/:a/:b/:c"
  to = "/:a/:b/:c/index.html"
  status = 200

# ── PERFORMANCE: LONG-CACHE STATIC ASSETS ─────────────
# Images, fonts, and SVGs are content-addressed or rarely change.
# 1-year immutable cache eliminates 75 KiB of repeat downloads per visit.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Externalized brand logos (wordmark, icon, marks) — rarely change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/case-studies/*/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root-level consent script (not under /fonts or /images) — moderate cache
[[headers]]
  for = "/mkx-consent.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── SECURITY HEADERS ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://services.leadconnectorhq.com https://widgets.leadconnectorhq.com https://cdn.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://buy.stripe.com https://cdn-cgi.cloudflare.com https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://assets.calendly.com; connect-src 'self' https://services.leadconnectorhq.com https://widgets.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://services.msgsndr.com https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; img-src 'self' data: https:; frame-src https://buy.stripe.com https://widgets.leadconnectorhq.com https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://calendly.com; style-src 'self' 'unsafe-inline' https://cdn.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://fonts.bunny.net https://fonts.googleapis.com https://assets.calendly.com; font-src 'self' https://cdn.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://fonts.bunny.net https://fonts.gstatic.com;"

# Join/confirmation pages — noindex (payment flow)
[[headers]]
  for = "/join/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Paid landing pages — noindex. These argue the same case as their organic
# counterparts by design (e.g. /lp/keep-control vs
# /intel/switch-property-manager-to-revenue-manager) and must never compete with
# them in search; that's the whole reason they're separate pages. The in-head
# meta robots tag says the same thing — this is the edge-level backstop.
[[headers]]
  for = "/lp/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Intel report pages — noindex (gated content, form required)
[[headers]]
  for = "/intel/*/report/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Audit deliverables — noindex (confidential client pages; meta-robots also set)
[[headers]]
  for = "/audits/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
