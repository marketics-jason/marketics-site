# ══════════════════════════════════════════════════════
#  Marketics — Netlify Configuration
# ══════════════════════════════════════════════════════

# ── PARTNER REFERRAL REDIRECTS ─────────────────────────
# Cost Seg Smart branded referral link (Strategy brief, 2026-07-30). Ref code
# and UTM params are defined ONCE here — editing the destination means editing
# these two rules, nowhere else. :placement is forwarded from the path into
# utm_content so each surface (partner page, intel article, email footer, a
# 1:1 send) is distinguishable in Cost Seg Smart's own UTM reporting.
#
# True 301 (not 302) per spec — permanent-redirect semantics for a durable
# branded link. NOTE: because this is a pure edge redirect (no page ever
# renders on our domain), no on-page script can fire, so this alone does NOT
# give an independent click count — see the accompanying brief note on that
# gap before treating this as the finished tracking solution.
#
# Must be listed BEFORE the generic /:seg and /:a/:b rewrite rules below —
# Netlify matches redirects in file order, first match wins, and those
# generic single/two-segment patterns would otherwise shadow /costseg and
# /costseg/:placement before this block is ever reached.
[[redirects]]
  from = "/costseg/:placement"
  to = "https://costsegsmart.com/order/?ref=MARKETICS-Q0DZ&utm_source=marketics&utm_medium=partner&utm_campaign=costseg&utm_content=:placement"
  status = 301
  force = true
[[redirects]]
  from = "/costseg"
  to = "https://costsegsmart.com/order/?ref=MARKETICS-Q0DZ&utm_source=marketics&utm_medium=partner&utm_campaign=costseg&utm_content=direct"
  status = 301
  force = true

# Trailing-slash canonicalisation
# Every page's <link rel="canonical"> uses the NO-SLASH form (/method). Without
# these rules Netlify 301-redirects the no-slash request to the directory form
# (/method → /method/), i.e. it redirects AWAY from the canonical URL — bad for
# crawlers and it broke header/CSP smoke checks (they read /join/confirmation,
# which was 301ing).
#
# Fix: serve each directory's index at its no-slash URL as a 200 rewrite (not a
# redirect), so /method, /intel/miami, and /intel/miami/report resolve to 200
# directly — matching the canonical tags, no redirect. Non-force, so real files
# (/assets/*, /robots.txt, /*.svg, …) keep static-file precedence and are served
# directly rather than rewritten.
#
# The SLASH form (/method/) still returns 200 via Netlify's built-in directory
# index — forced redirects can't override directory-index resolution on this
# platform, so a strict slash→no-slash 301 isn't achievable without flattening
# every index.html to a .html file. The canonical tag on each page dedupes the
# slash/no-slash pair for search engines, so this is cosmetic, not an SEO risk.
[[redirects]]
  from = "/:seg"
  to = "/:seg/index.html"
  status = 200
[[redirects]]
  from = "/:a/:b"
  to = "/:a/:b/index.html"
  status = 200
[[redirects]]
  from = "/:a/:b/:c"
  to = "/:a/:b/:c/index.html"
  status = 200

# ── PERFORMANCE: LONG-CACHE STATIC ASSETS ─────────────
# Images, fonts, and SVGs are content-addressed or rarely change.
# 1-year immutable cache eliminates 75 KiB of repeat downloads per visit.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Externalized brand logos (wordmark, icon, marks) — rarely change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/case-studies/*/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root-level consent script (not under /fonts or /images) — moderate cache
[[headers]]
  for = "/mkx-consent.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── SECURITY HEADERS ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://services.leadconnectorhq.com https://widgets.leadconnectorhq.com https://cdn.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://buy.stripe.com https://cdn-cgi.cloudflare.com https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://assets.calendly.com; connect-src 'self' https://services.leadconnectorhq.com https://widgets.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://services.msgsndr.com https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; img-src 'self' data: https:; frame-src https://buy.stripe.com https://widgets.leadconnectorhq.com https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://calendly.com; style-src 'self' 'unsafe-inline' https://cdn.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://fonts.bunny.net https://fonts.googleapis.com https://assets.calendly.com; font-src 'self' https://cdn.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://fonts.bunny.net https://fonts.gstatic.com;"

# Join/confirmation pages — noindex (payment flow)
[[headers]]
  for = "/join/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Intel report pages — noindex (gated content, form required)
[[headers]]
  for = "/intel/*/report/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Audit deliverables — noindex (confidential client pages; meta-robots also set)
[[headers]]
  for = "/audits/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
